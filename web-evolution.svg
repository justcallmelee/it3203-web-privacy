    <text x="360" y="130" font-size="13" fill="#5d6573">Social platforms</text>
    <text x="360" y="150" font-size="13" fill="#5d6573">Data held by companies</text>
    <rect x="500" y="40" width="200" height="140" rx="8" fill="#e3f2f1" stroke="#1b7f79" stroke-width="3"/>
    <text x="600" y="75" font-size="20" font-weight="bold" fill="#1b7f79">Web 3.0</text>
